# Minimal human-reviewed trust root for KarstZero (Nemesis Core 4.0).
name: bootstrap

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('bootstrap-pr-{0}', github.event.pull_request.number) || format('bootstrap-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  template-gate:
    name: acceptance / ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm install --no-package-lock --legacy-peer-deps

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Render portal view and run the complete acceptance gate
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo run -p xtask -- render-view
          cargo run -p xtask -- validate
          cargo test --workspace --all-targets
