name: Deploy KarstZero to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  view:
    name: Render & Verify Portal View Artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm install --no-package-lock --legacy-peer-deps

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Render interactive game & PrismPM/LexLean portal (`view/`)
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: cargo run -p xtask -- render-view

      - name: Run full repository validation & conformance gate
        run: |
          cargo fmt --all -- --check
          cargo run -p xtask -- validate
          cargo test --workspace --all-targets

      - name: Upload view artifact
        uses: actions/upload-artifact@v4
        with:
          name: karst-zero-current-view
          path: view
          include-hidden-files: true

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: view

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: view
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy rendered portal to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify Deployed Page Serves Commit
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Fetch deployed portal pages and verify embedded commit SHA
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl -fsSL "${PAGE_URL%/}/register.json" -o /tmp/register.json && grep -qF "\"commit\": \"$GITHUB_SHA\"" /tmp/register.json; then
              for page in index.html model.prism.json logo.svg banner.svg topology.svg; do
                curl -fsSL "${PAGE_URL%/}/$page" -o /dev/null
              done
              echo "$PAGE_URL serves commit $GITHUB_SHA across interactive game and PrismPM artifacts"
              exit 0
            fi
            sleep 10
          done
          echo "$PAGE_URL did not yet reflect commit $GITHUB_SHA" >&2
          exit 1
