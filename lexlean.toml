spec = "lexlean/project/1"
name = "karst-zero"
language = "1.2"
module_prefix = "KarstZero"
source_roots = ["src", "stdlib"]
entrypoints = ["src/Application.lex.tex", "src/Architecture.lex.tex", "src/CampaignBastion.lex.tex", "src/CombatEngine.lex.tex", "src/Contract.lex.tex", "src/Design.lex.tex", "src/Main.lex.tex", "src/NemesisChit.lex.tex", "src/NemesisEngine.lex.tex", "src/Presentation.lex.tex", "src/ResonanceWeave.lex.tex", "src/Standards.lex.tex", "src/UnitSynthesis.lex.tex"]
build_root = ".lexlean"
lockfile = "lexlean.lock"
lean_workspace = "."
lean_toolchain = "leanprover/lean4:v4.32.1"

[[lexicon_source]]
package = "lexlean.std.bool"
kind = "builtin"

[[lexicon_source]]
package = "lexlean.std.int"
kind = "builtin"

[[lexicon_source]]
package = "lexlean.std.nat"
kind = "builtin"

[[lexicon_source]]
package = "prism.arch"
kind = "path"
path = "language/prism.arch"

[[lexicon_source]]
package = "prism.karst"
kind = "path"
path = "language/prism.karst"

[[lexicon_source]]
package = "prism.qual"
kind = "path"
path = "language/prism.qual"

[[lexicon_source]]
package = "prism.sec"
kind = "path"
path = "language/prism.sec"

[limits]
max_file_bytes = 4194304
max_total_source_bytes = 67108864
max_primitive_atoms = 2000000
max_token_lattice_edges = 4000000
max_parse_states = 4000000
max_ir_nodes = 2000000
max_scope_depth = 1024
max_import_depth = 128
max_diagnostics = 256
max_child_output_bytes = 16777216
child_timeout_ms = 600000
