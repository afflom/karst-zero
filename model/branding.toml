foreground = "color.text.secondary"
background = "color.bg.canvas"
min_ratio_tenths = 45

[[contrast_pair]]
id = "pair-canvas-strike"
foreground = "color.accent.strike"
background = "color.bg.canvas"
min_ratio_tenths = 45

[[contrast_pair]]
id = "pair-canvas-warden"
foreground = "color.accent.warden"
background = "color.bg.canvas"
min_ratio_tenths = 45

[[contrast_pair]]
id = "pair-canvas-resonance"
foreground = "color.accent.resonance"
background = "color.bg.canvas"
min_ratio_tenths = 45

[[contrast_pair]]
