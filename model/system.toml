[[feature]]
id = "Architecture::feature00UnitSynthesisAndCharter"
statement = "Compile 150 unit archetypes across [Doctrine (6), Chassis (5), Echelon (5)] and enforce the 6-Berth / 16-Alloy starting charter and Zero-Stat-Inflation law."

[[feature]]
id = "Architecture::feature01OpposedStrikeAndMitigation"
statement = "Resolve opposed d6 Strike Pools, 4-sector Momentum Charges, Barricade/Bulkhead cover, Plating/Resilience mitigation, and Fireteam casualty spillover."

[[feature]]
id = "Architecture::feature02ResonanceWeaveAndModules"
statement = "Equip 1-Hardpoint (3 Alloy) and 2-Hardpoint Masterwork (6 Alloy) modules across 6 Resonance Frequencies with Minor/Major Harmonics and Overheat Backlash."

[[feature]]
id = "Architecture::feature03CommandChitAndWardenAi"
statement = "Drive 5-round tactical drops via an opaque Command Chit Pool, returning Warden Directive Chit, 1d6 wrap-around berth selector, and 6 Doctrine AI routines."

[[feature]]
id = "Architecture::feature04OrbitalBastionAndContracts"
statement = "Execute 4 Pre-Drop Crew Assignments with Push risk, upgrade 3 Orbital Bastion Facilities, launch 6 Core Sector Contracts, and verify save receipts."

[[feature]]
id = "Architecture::feature05NemesisEngineFullBinding"
statement = "Enforce that Karst: Zero Horizon consumes all 6 Nemesis Core 4.0 engine subsystems and verifies all boundary contracts through Core-Wasm."

[[feature]]
id = "Architecture::feature06SpatialWorldAndPresets"
statement = "Project the 2.5D isometric and 2D top-down object-spatial viewport across 7 Karst-9 locations, 9 Minor Resonance Directives, and 4 Starting Company Presets."

[[feature]]
id = "Architecture::feature07AnimationChoreographyAndVfx"
statement = "Choreograph 8 deterministic fixed-point animation clips, parabolic hop arcs, 5 Chassis gaits, 6 Doctrine VFX profiles, and WCAG reduced-motion transitions."

