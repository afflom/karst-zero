<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="55%" stop-color="#0F141C"/>
      <stop offset="100%" stop-color="#131C2B"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF7A1A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2AD4C5"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Obsidian Slate Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- 2.5D Isometric Sector Grid Lines -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.65">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="150" y1="0" x2="150" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="750" y1="0" x2="750" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1050" y1="0" x2="1050" y2="630"/>
    <!-- Isometric diagonals on right side -->
    <line x1="680" y1="0" x2="1200" y2="320" stroke="#1E3A5F"/>
    <line x1="780" y1="0" x2="1200" y2="260" stroke="#1E3A5F"/>
    <line x1="680" y1="630" x2="1200" y2="310" stroke="#1E3A5F"/>
  </g>

  <!-- Outer Tactical Frame -->
  <rect x="28" y="28" width="1144" height="574" rx="20" fill="none" stroke="#334155" stroke-width="2"/>
  <rect x="28" y="28" width="1144" height="6" fill="url(#amberGrad)"/>

  <!-- Hexagonal Karst Vault Emblem -->
  <g transform="translate(135, 165)">
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="#131B2E" stroke="#FF7A1A" stroke-width="4"/>
    <polygon points="0,-62 54,-31 54,31 0,62 -54,31 -54,-31" fill="#0F172A" stroke="#2AD4C5" stroke-width="2.5"/>
    <polygon points="0,-34 30,-17 30,17 0,34 -30,17 -30,-17" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="#10B981"/>
    <line x1="0" y1="-90" x2="0" y2="-62" stroke="#94A3B8" stroke-width="2"/>
    <line x1="78" y1="-45" x2="54" y2="-31" stroke="#94A3B8" stroke-width="2"/>
    <line x1="78" y1="45" x2="54" y2="31" stroke="#94A3B8" stroke-width="2"/>
    <line x1="0" y1="90" x2="0" y2="62" stroke="#94A3B8" stroke-width="2"/>
    <line x1="-78" y1="45" x2="-54" y2="31" stroke="#94A3B8" stroke-width="2"/>
    <line x1="-78" y1="-45" x2="-54" y2="-31" stroke="#94A3B8" stroke-width="2"/>
  </g>

  <!-- Top Eyebrow Badge -->
  <rect x="255" y="72" width="590" height="34" rx="8" fill="#172033" stroke="#FF7A1A" stroke-width="1.5"/>
  <text x="273" y="94" fill="#FF7A1A" font-family="monospace" font-size="15" font-weight="bold">NEMESIS CORE 4.0 GAME ENGINE · LEXLEAN v0.4 · PRISMPM v0.4</text>

  <!-- Primary Title & Subtitle -->
  <text x="255" y="162" fill="#F4F7FA" font-family="monospace" font-size="54" font-weight="bold">KARST: ZERO HORIZON</text>
  <text x="255" y="205" fill="#2AD4C5" font-family="monospace" font-size="22" font-weight="bold">2.5D Isometric Tactical Skirmish &amp; Orbital Campaign Wargame</text>
  <text x="255" y="242" fill="#94A3B8" font-family="monospace" font-size="16">Command your 6-Berth / 16-Alloy Strike Roster across 6 Vault Sectors on Karst-9.</text>

  <!-- 6 Certified Nemesis Core 4.0 Subsystem Cards -->
  <g transform="translate(60, 290)" font-family="monospace">
    <!-- Card 1 -->
    <rect x="0" y="0" width="345" height="96" rx="10" fill="#131B2E" stroke="#334155" stroke-width="1.5"/>
    <text x="18" y="28" fill="#FF7A1A" font-size="13" font-weight="bold">SUB-01 · 3D UNIT SYNTHESIS</text>
    <text x="18" y="52" fill="#F4F7FA" font-size="16" font-weight="bold">150 Archetypes (6 x 5 x 5)</text>
    <text x="18" y="76" fill="#94A3B8" font-size="12">6-Berth / 16-Alloy · Zero-Stat-Inflation</text>

    <!-- Card 2 -->
    <rect x="367" y="0" width="345" height="96" rx="10" fill="#131B2E" stroke="#334155" stroke-width="1.5"/>
    <text x="385" y="28" fill="#2AD4C5" font-size="13" font-weight="bold">SUB-02 · OPPOSED d6 COMBAT</text>
    <text x="385" y="52" fill="#F4F7FA" font-size="16" font-weight="bold">Strike Pool &amp; Cover LoS</text>
    <text x="385" y="76" fill="#94A3B8" font-size="12">Momentum Charge · 1d6 Rupture · Spillover</text>

    <!-- Card 3 -->
    <rect x="734" y="0" width="345" height="96" rx="10" fill="#131B2E" stroke="#334155" stroke-width="1.5"/>
    <text x="752" y="28" fill="#FF7A1A" font-size="13" font-weight="bold">SUB-03 · RESONANCE WEAVE</text>
    <text x="752" y="52" fill="#F4F7FA" font-size="16" font-weight="bold">6 Frequencies · 16 Modules</text>
    <text x="752" y="76" fill="#94A3B8" font-size="12">Harmonic Rank · 9 Directives · Backlash</text>

    <!-- Card 4 -->
    <rect x="0" y="114" width="345" height="96" rx="10" fill="#131B2E" stroke="#334155" stroke-width="1.5"/>
    <text x="18" y="142" fill="#2AD4C5" font-size="13" font-weight="bold">SUB-04 · OPAQUE CHIT AI</text>
    <text x="18" y="166" fill="#F4F7FA" font-size="16" font-weight="bold">5-Round Warden Director</text>
    <text x="18" y="190" fill="#94A3B8" font-size="12">1d6 Wrap-Around · 6 Doctrine AI Routines</text>

    <!-- Card 5 -->
    <rect x="367" y="114" width="345" height="96" rx="10" fill="#131B2E" stroke="#334155" stroke-width="1.5"/>
    <text x="385" y="142" fill="#FF7A1A" font-size="13" font-weight="bold">SUB-05 · ORBITAL BASTION</text>
    <text x="385" y="166" fill="#F4F7FA" font-size="16" font-weight="bold">4 Crew Tasks · 3 Facilities</text>
    <text x="385" y="190" fill="#94A3B8" font-size="12">6 Vault Contracts · FNV-1a/BLAKE3 Digest</text>

    <!-- Card 6 -->
    <rect x="734" y="114" width="345" height="96" rx="10" fill="#131B2E" stroke="#334155" stroke-width="1.5"/>
    <text x="752" y="142" fill="#2AD4C5" font-size="13" font-weight="bold">SUB-06 · 2.5D SPATIAL WORLD</text>
    <text x="752" y="166" fill="#F4F7FA" font-size="16" font-weight="bold">7 Karst-9 World Locations</text>
    <text x="752" y="190" fill="#94A3B8" font-size="12">Isometric Depth Key · 4 Company Presets</text>
  </g>

  <!-- Bottom Formal Verification Status Bar -->
  <rect x="60" y="526" width="1080" height="48" rx="10" fill="#0B0F17" stroke="#2AD4C5" stroke-width="1.5"/>
  <circle cx="90" cy="550" r="8" fill="#10B981"/>
  <text x="112" y="556" fill="#F4F7FA" font-family="monospace" font-size="15" font-weight="bold">18/18 LEXLEAN v0.4 MODULES · 76 PRISMPM v0.4 FACET ENTITIES · 17/17 CONFORMANCE (TC-01, KZ-01..KZ-16)</text>
</svg>
